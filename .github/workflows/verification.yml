name: Vérification

# La gouvernance, légère, suit chaque envoi. Les jobs sur Windows ne tournent que sur une demande
# de fusion prête (pas un brouillon) et sur main : ce sont eux qui consomment le quota d'Actions.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gouvernance:
    name: Gouvernance du dépôt
    # Elle a déjà vu ces commits à leur envoi.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Récupération de l'historique complet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plage de commits envoyés
        id: plage
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
        run: |
          set -eu
          if [ -n "${AVANT:-}" ] && [ "$AVANT" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$AVANT^{commit}" 2>/dev/null; then
            echo "valeur=$AVANT..$APRES" >> "$GITHUB_OUTPUT"
          else
            echo "valeur=$APRES" >> "$GITHUB_OUTPUT"
          fi

      - name: Identité et messages des commits
        env:
          PLAGE: ${{ steps.plage.outputs.valeur }}
        run: sh tools/git/check-commits.sh "$PLAGE"

      - name: Nom de la branche
        if: github.ref_name != 'main'
        env:
          BRANCHE: ${{ github.ref_name }}
        run: sh tools/git/check-branch-name.sh "$BRANCHE"

      - name: Fusions sur main
        if: github.ref_name == 'main'
        env:
          PLAGE: ${{ steps.plage.outputs.valeur }}
        run: sh tools/git/check-main-merges.sh "$PLAGE"

      - name: Détection de secrets dans tout l'historique (gitleaks)
        run: |
          set -eu
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  construction:
    name: Compilation, tests et qualité
    # Sur Windows, ce job coûte cher : il attend une demande de fusion prête, ou main.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SDK .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Outils .NET locaux
        run: dotnet tool restore

      - name: Restauration verrouillée
        run: dotnet restore KyfRev.slnx --locked-mode

      - name: Compilation
        run: dotnet build KyfRev.slnx --configuration Release --no-restore

      # Chaque projet de tests mesure les modules qu'il teste (testconfig.json du projet) ; le
      # seuil s'applique à chacun de ces modules. Coverlet ignore sans le dire un filtre qui
      # contient un tiret : « [kyfrev*coffre]* » désigne l'assembly kyfrev-coffre.
      # Un projet après l'autre : les scénarios d'acceptation ouvrent et ferment de vraies fenêtres,
      # et ceux qui parcourent le bureau ou ouvrent un menu ne doivent pas les croiser.
      - name: Tests et couverture (95 % des lignes au minimum)
        run: >-
          dotnet test --solution KyfRev.slnx --configuration Release --no-build
          --max-parallel-test-modules 1
          --coverlet --coverlet-output-format cobertura
          --coverlet-threshold 95 --coverlet-threshold-type line
          --results-directory artifacts/coverage

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture
          path: artifacts/coverage/*.xml
          if-no-files-found: ignore
          retention-days: 30

      # Le format analyse les projets compilés plus haut, en Release : le code que WPF génère
      # depuis le XAML (InitializeComponent, éléments nommés) y existe déjà.
      - name: Mise en forme
        env:
          Configuration: Release
        run: dotnet format KyfRev.slnx --verify-no-changes --no-restore

      - name: Paquets vulnérables
        run: |
          $json = dotnet list KyfRev.slnx package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vulnerables = @(($json | ConvertFrom-Json).projects.frameworks |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } |
            Where-Object { $_ -and $_.vulnerabilities })
          $vulnerables | ForEach-Object { Write-Output "Vulnérable : $($_.id) $($_.resolvedVersion)" }
          if ($vulnerables.Count -gt 0) { exit 1 }
          Write-Output 'Aucun paquet vulnérable connu.'

      - name: Raccourcis interdits (tests désactivés, avertissements masqués, exceptions avalées)
        run: dotnet slopwatch analyze --no-baseline --fail-on warning

  editeur-visuel:
    name: Éditeur visuel
    # Sur Windows, ce job coûte cher : il attend une demande de fusion prête, ou main.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/visual-editor
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances verrouillées
        run: npm ci --ignore-scripts

      - name: Types
        run: npm run check

      - name: Aller-retour Markdown et cas de la 0.x
        run: npm test

      - name: Le paquet versionné correspond à ses sources
        run: |
          npm run build
          git status --porcelain -- ../../src/KyfRev.Presentation.Wpf/Editing/Web
          git diff --exit-code -- ../../src/KyfRev.Presentation.Wpf/Editing/Web

  installateur:
    name: Installateur
    # Sur Windows, ce job coûte cher : il attend une demande de fusion prête, ou main.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref_name == 'main')
      || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      INNO_SETUP_VERSION: 6.7.3
      INNO_SETUP_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: SDK .NET (global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Inno Setup (version figée, empreinte vérifiée, pour l'utilisateur)
        run: |
          $nom = "innosetup-$env:INNO_SETUP_VERSION.exe"
          $etiquette = 'is-' + $env:INNO_SETUP_VERSION.Replace('.', '_')
          $programme = Join-Path $env:RUNNER_TEMP $nom
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/$etiquette/$nom" -OutFile $programme
          if ((Get-FileHash $programme -Algorithm SHA256).Hash -ne $env:INNO_SETUP_SHA256) { throw 'Empreinte d''Inno Setup inattendue.' }
          $dossier = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $installation = Start-Process $programme -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dossier`"" -Wait -PassThru
          if ($installation.ExitCode -ne 0) { throw "Installation d'Inno Setup impossible (code $($installation.ExitCode))." }
          "ISCC=$(Join-Path $dossier 'ISCC.exe')" >> $env:GITHUB_ENV

      - name: Construction de l'installateur
        run: |
          $installateur = ./tools/installer.ps1 -Iscc $env:ISCC
          "INSTALLATEUR=$installateur" >> $env:GITHUB_ENV

      - name: Installateur
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installateur
          path: ${{ env.INSTALLATEUR }}
          if-no-files-found: error
          retention-days: 30

      - name: Installation, mise à jour et désinstallation sans droits administrateur
        run: ./tools/installer-tests.ps1 -Installateur $env:INSTALLATEUR -PosteVierge

      - name: Journaux d'Inno Setup
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journaux-installateur
          path: artifacts/installer/essais
          if-no-files-found: ignore
          retention-days: 30
