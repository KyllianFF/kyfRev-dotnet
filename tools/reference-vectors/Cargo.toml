[package]
name = "reference-vectors"
description = "Vecteurs de référence produits par le cœur Rust de kyfRev 0.x, pour les tests différentiels de KyfRev.Domain"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

# Projet autonome : ne rejoint pas l'espace de travail du dépôt kyfRev 0.x.
[workspace]

[dependencies]
# Clone du dépôt kyfRev 0.x à côté de ce dépôt (voir README.md).
noyau = { path = "../../../kyfRev/crates/noyau" }
coffre = { path = "../../../kyfRev/crates/coffre" }
jiff = "=0.2.38"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
